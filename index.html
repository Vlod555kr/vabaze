<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VA BAZE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
            scroll-behavior: smooth;
        }
        body {
            background-color: #040404;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(4, 4, 4, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            z-index: 1000;
        }
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            color: #fff;
            text-decoration: none;
        }
        .logo span {
            color: #ff2a2a;
        }
        .nav-links a {
            color: #777;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-left: 30px;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: #fff;
        }
        .hero-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: 120px;
            background: radial-gradient(circle at 50% 30%, #2a0808 0%, #040404 65%);
            text-align: center;
        }
        .badge {
            display: inline-block;
            background-color: rgba(255, 42, 42, 0.08);
            color: #ff3b3b;
            border: 1px solid rgba(255, 42, 42, 0.2);
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: 0.5px;
        }
        h1 {
            font-size: clamp(34px, 6.5vw, 68px);
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -1.5px;
            max-width: 950px;
            margin: 0 auto 24px auto;
        }
        h1 span {
            color: #ff2a2a;
        }
        .hero-subtitle {
            font-size: clamp(16px, 2.3vw, 19px);
            color: #88888b;
            max-width: 650px;
            margin: 0 auto 40px auto;
        }
        .btn {
            display: inline-block;
            text-decoration: none;
            padding: 16px 38px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 100px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .btn-primary {
            background-color: #ff2a2a;
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(255, 42, 42, 0.25);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            background-color: #ff4545;
            box-shadow: 0 12px 35px rgba(255, 42, 42, 0.5);
        }
        .btn-secondary {
            background-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: #ff2a2a;
            color: #ff2a2a;
        }
        .section-title {
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 48px;
            text-align: center;
        }
        .section-title span {
            color: #ff2a2a;
        }
        .section-subtitle {
            color: #777;
            margin-top: -30px;
            margin-bottom: 60px;
            font-size: 16px;
            text-align: center;
        }
        .about-section {
            padding: 120px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }
        .about-grid {
            display: grid;
            grid-template-columns: 1.2fr 1.8fr;
            gap: 40px;
            align-items: stretch;
        }
        .author-main-card {
            background-color: #0c0c0c;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .author-info {
            padding: 24px;
        }
        .author-info h3 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .author-tag {
            color: #777;
            font-size: 14px;
        }
        .facts-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .fact-card {
            background-color: #0c0c0c;
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 32px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .fact-num {
            font-size: 32px;
            font-weight: 800;
            color: #ff2a2a;
            margin-bottom: 8px;
        }
        .fact-card p {
            color: #b5b5b8;
            font-size: 15px;
        }
        .info-section {
            padding: 100px 0;
            background-color: #080808;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .info-card {
            background-color: #0c0c0c;
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 40px;
            border-radius: 24px;
        }
        .info-card h3 {
            font-size: 22px;
            margin-bottom: 16px;
            font-weight: 700;
        }
        .info-card p {
            color: #777;
            font-size: 15px;
        }
        .program-section {
            padding: 120px 0;
        }
        .program-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .step-card {
            background-color: #0c0c0c;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 40px;
            display: grid;
            grid-template-columns: 70px 1fr;
            gap: 30px;
            transition: all 0.3s ease;
        }
        .step-card:hover {
            border-color: rgba(255, 42, 42, 0.25);
            background-color: #0f0c0c;
        }
        .step-card.highlight {
            border-color: rgba(255, 42, 42, 0.4);
            background: linear-gradient(135deg, #0d0c0c 0%, #1c0505 100%);
        }
        .step-num {
            font-size: 20px;
            font-weight: 800;
            color: #ff2a2a;
            background-color: rgba(255, 42, 42, 0.06);
            width: 56px;
            height: 56px;
            border-radius: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            align-self: start;
        }
        .step-content h3 {
            font-size: 23px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .step-description {
            color: #777;
            font-size: 15px;
            margin-bottom: 20px;
        }
        .inner-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .inner-list li {
            font-size: 15px;
            color: #b5b5b8;
            padding-left: 20px;
            position: relative;
        }
        .inner-list li::before {
            content: "—";
            position: absolute;
            left: 0;
            color: #ff2a2a;
            font-weight: bold;
        }
        .inner-list li span {
            color: #fff;
            font-weight: 600;
        }
        .results-section {
            padding: 120px 0;
            background-color: #080808;
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }
        .student-card {
            background-color: #0c0c0c;
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 32px;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
        }
        .student-header h4 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        .student-gallery {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .student-gallery img {
            width: 85px;
            height: 110px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
            transition: transform 0.3s;
        }
        .student-gallery img.income-img {
            border-color: rgba(57, 255, 20, 0.2);
        }
        .student-gallery img:hover {
            transform: scale(1.05);
        }
        .point-box {
            font-size: 14px;
            color: #b5b5b8;
            margin-top: 12px;
            line-height: 1.5;
        }
